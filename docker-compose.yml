version: '3.9'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server

    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - ./docker/clickhouse_data:/var/lib/clickhouse

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123

    ulimits:
      nofile:
        soft: 262144
        hard: 262144
